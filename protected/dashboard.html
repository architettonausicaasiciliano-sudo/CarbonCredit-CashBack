<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — CarbonCredit CashBack</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header class="dashboard-header">
            <h1>🏆 La tua Area Riservata</h1>
            <a href="/add-asset" class="btn btn-primary">+ Registra Nuovo Bene / Acquisto</a>
        </header>

        <!-- STATISTICHE UTENTE -->
        <div class="stats-grid">
            <div class="card stat-card">
                <h3>Saldo Cashback</h3>
                <p class="stat-value" id="totalCashback">€ 0,00</p>
            </div>
            <div class="card stat-card">
                <h3>Crediti CO₂ Generati</h3>
                <p class="stat-value" id="totalCo2">0,00 Ton</p>
            </div>
        </div>

        <!-- LISTA BENI E ACQUISTI REGISTRATI -->
        <section class="card">
            <h2>i Miei Beni & Acquisti Registrati</h2>
            <div id="assetsList" class="assets-list">
                <p class="empty-msg">Nessun bene o acquisto ancora registrato. Clicca sul pulsante in alto per iniziare!</p>
            </div>
        </section>
    </div>

    <script src="/protected/js/dashboard.js"></script>
</body>
</html>
