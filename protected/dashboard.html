<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard dMRV — Impatto & Cashback</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-green: #10b981;
      --accent-green-bright: #34d399;
      --accent-blue: #38bdf8;
      --text-muted: #94a3b8;
    }

    body {
      background: var(--bg-dark);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .btn-primary {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: 1px solid #34d399;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.9rem;
      transition: box-shadow 0.2s;
    }
    .btn-primary:hover {
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.5);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .stat-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-green-bright);
      margin-top: 6px;
    }

    .b2b-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 22px;
      margin-top: 24px;
    }

    .btn-action {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green-bright);
      border: 1px solid var(--accent-green);
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 14px;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1 style="font-size: 1.4rem; color: var(--accent-green-bright); margin: 0;">🌱 Dashboard Gestione Beni dMRV</h1>
    <a href="/add-asset" class="btn-primary">➕ Registra Nuovo Bene</a>
  </div>

  <!-- Contatori Statistiche principali -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Crediti Convalidati</div>
      <div id="userCredits" class="stat-val">0.0 CC</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Stima Crediti In sospeso</div>
      <div id="pendingCcVal" class="stat-val">0 CC</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">CO₂ Evitata</div>
      <div id="totalCo2" class="stat-val">0.0 kg</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Equivalente Alberi</div>
      <div id="totalTrees" class="stat-val">0 🌳</div>
      <div id="treeBannerText" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;"></div>
    </div>
  </div>

  <!-- Card B2B & Payout -->
  <div class="b2b-card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h3 style="margin: 0; font-size: 1.05rem;">💰 Saldo Cashback Maturato (10%)</h3>
        <span style="font-size: 0.8rem; color: var(--text-muted);">Batch ID: <strong id="batchId" style="color: var(--accent-blue);">N/A</strong> | Stato: <span id="batchStatus">In lavorazione</span></span>
      </div>
      <div id="pendingEur" style="font-size: 1.6rem; font-weight: 900; color: var(--accent-green-bright);">€ 0.00</div>
    </div>
    <button id="btnRedeem" class="btn-action">💸 RICHIEDI PAYOUT CASHBACK</button>
  </div>

  <!-- Lista Beni Registrati -->
  <h3 style="margin-top: 32px; font-size: 1.1rem;">📦 Elenco Beni & Prova d'Acquisto</h3>
  <div id="assetsList"></div>
</div>

<script src="/protected/js/dashboard.js"></script>
</body>
</html>
