<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggiungi Bene / Acquisto Sostenibile</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: #0b0f19; color: #f3f4f6; font-family: sans-serif; padding: 20px; }
    .card { background: #111827; border: 1px solid #374151; border-radius: 16px; padding: 20px; max-width: 480px; margin: 0 auto; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 6px; color: #9ca3af; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: white; box-sizing: border-box; }
    .btn-submit { width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="card">
  <h2 style="color: #34d399; margin-bottom: 16px;">🌱 Registra Acquisto Green</h2>
  
  <form id="addAssetForm" enctype="multipart/form-data">
    <div class="form-group">
      <label>Nome Bene / Acquisto</label>
      <input type="text" name="title" placeholder="Es. Pannello Solare 400W / Bici Elettrica" required>
    </div>

    <div class="form-group">
      <label>Categoria Sostenibile</label>
      <select name="category">
        <option value="Energia">Energia / Efficienza Domestica</option>
        <option value="Mobilita">Mobilità Elettrica / Sostenibile</option>
        <option value="SpesaEco">Spesa Biologica / Prodotti Eco</option>
        <option value="Elettrodomestici">Elettrodomestico A+++</option>
      </select>
    </div>

    <div class="form-group">
      <label>Importo Speso (€)</label>
      <input type="number" step="0.01" name="amount" placeholder="0.00" required>
    </div>

    <div class="form-group">
      <label>📸 Foto Scontrino, Fattura o Installazione</label>
      <input type="file" name="photo" accept="image/*">
    </div>

    <button type="submit" class="btn-submit">GENERA CREDITI & CASHBACK ➔</button>
  </form>
</div>

<script>
  document.getElementById('addAssetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);

    const res = await fetch('/api/assets', {
      method: 'POST',
      body: formData
    });

    const data = await res.json();
    if (data.success) {
      alert(`Bene registrato! CO2 Risparmiata: ${data.co2Saved} kg | Cashback Accumulato: €${data.cashbackEur}`);
      window.location.href = '/protected/dashboard.html';
    }
  });
</script>
<script>
// 1. Funzione per calcolare l'hash SHA-256 del file lato client (Costo €0.00)
async function calculateImageHash(file) {
  const arrayBuffer = await file.arrayBuffer();
  const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

document.querySelector('form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const userEmail = localStorage.getItem('userEmail') || 'test@example.com'; // Recupera email sessione
  const title = document.querySelector('input[placeholder="Nome Bene / Acquisto"]').value || document.querySelectorAll('input')[0].value;
  const category = document.querySelector('select').value;
  const amountSpend = document.querySelectorAll('input')[1].value;
  const fileInput = document.querySelector('input[type="file"]');
  const file = fileInput.files[0];

  if (!file) {
    alert("Seleziona una foto dello scontrino o installazione.");
    return;
  }

  try {
    // A. Calcolo Hash SHA-256 locale
    const imageHash = await calculateImageHash(file);

    // B. Filtro Antiduplicato Client-Side
    const checkRes = await fetch(`/api/check-duplicate?hash=${imageHash}`);
    const checkData = await checkRes.json();
    if (checkData.isDuplicate) {
      alert("⚠️ Errore: Questa immagine è già stata caricata in precedenza!");
      return;
    }

    // C. Preparazione FormData per il Backend
    const formData = new FormData();
    formData.append('email', userEmail);
    formData.append('title', title);
    formData.append('category', category);
    formData.append('amountSpend', amountSpend);
    formData.append('imageHash', imageHash);
    formData.append('photo', file);

    const submitBtn = e.target.querySelector('button');
    submitBtn.innerText = "Verifica AI in corso...";
    submitBtn.disabled = true;

    // D. Invio al server con Gemini AI MRV Engine
    const res = await fetch('/api/eco-actions', {
      method: 'POST',
      body: formData
    });

    const data = await res.json();

    if (res.ok) {
      alert(`✅ Azione Approvata dall'AI!\nCO2 Evitata: ${data.co2SavedKg} kg\nCrediti Accreditati: +${data.creditsAdded} CC`);
      window.location.href = '/dashboard';
    } else {
      alert(`❌ Errore: ${data.error}`);
      submitBtn.innerText = "GENERA CREDITI & CASHBACK ➔";
      submitBtn.disabled = false;
    }
  } catch (err) {
    console.error(err);
    alert("Errore di connessione al server.");
  }
});
</script>
</body>
</html>
